name: humanitz
services:
  humanitz:
    build:
      context: ./humanitz
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run sudo bash install.sh first}
      SERVER_NAME: ${SERVER_NAME:-HumanitZ Community}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      UPDATE_CHECK: "30"
    restart: unless-stopped
    stop_grace_period: 2m
    volumes:
      - humanitz-data:/data
    ports:
      - "7777:7777/udp"
      - "27015:27015/udp"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  humanitz-data:
    name: humanitz-data
